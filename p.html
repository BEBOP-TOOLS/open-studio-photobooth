<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Photo</title>
<link rel="stylesheet" href="style.css?v=20261027144302">
<style>
  main {
    max-width: 480px; margin: 0 auto;
    padding: 32px 16px calc(32px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 20px;
  }
  .photo { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; background: var(--line); }
  h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
  h1 span { color: var(--muted); font-weight: 500; font-size: 18px; margin-left: 8px; }
  .actions { display: flex; flex-direction: column; gap: 10px; }
  .actions button, .actions a { width: 100%; text-align: center; }
  .hint { color: var(--muted); font-size: 14px; line-height: 1.6; margin: 0; }
  a.link { color: var(--muted); font-size: 14px; }
  .steps { display: flex; flex-direction: column; gap: 14px; }
  .stepbox { display: grid; grid-template-columns: 28px 1fr; gap: 12px; transition: opacity .2s; }
  .stepbox .num {
    width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--muted);
    display: grid; place-items: center; font-size: 14px; font-weight: 700; color: var(--muted); margin-top: 12px;
  }
  .stepbox .body { display: flex; flex-direction: column; gap: 8px; }
  .stepbox.done .num { background: var(--fg); border-color: var(--fg); color: var(--bg); }
  .stepbox.dim { opacity: .45; }
  .btn {
    display: block; text-align: center; text-decoration: none; font-weight: 600; font-size: 17px;
    border: 1px solid var(--fg); color: var(--fg); border-radius: 999px; padding: 14px 28px;
  }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .steps button { width: 100%; }
  .sub-actions { display: flex; gap: 8px; }
  .sub-actions button { flex: 1; padding: 10px 12px; font-size: 15px; }
  .story-preview { display: none; }
  .story-preview.show { display: block; }
  .story-preview img { width: 100%; display: block; border: 1px solid var(--line); }
</style>
</head>
<body>
<main>
  <div class="eyebrow" id="sub"></div>
  <img class="photo" id="photo" alt="">
  <h1 id="who"></h1>
  <div class="steps" id="steps">
    <div class="stepbox" id="step1">
      <div class="num">1</div>
      <div class="body">
        <button class="primary" id="shareStory" disabled>스토리 이미지 저장</button>
        <p class="hint" id="hint1">공유 창에서 <b>이미지 저장</b>을 눌러주세요.<br>목록에 Instagram이 보이면 바로 눌러도 돼요.</p>
      </div>
    </div>
    <div class="stepbox dim" id="step2">
      <div class="num">2</div>
      <div class="body">
        <a class="btn" id="openIg" href="instagram://story-camera">인스타그램 스토리 열기</a>
        <p class="hint">스토리 화면 왼쪽 아래 갤러리에서 방금 저장한 사진을 골라주세요.</p>
      </div>
    </div>
  </div>
  <div class="story-preview" id="storyPreview">
    <p class="hint">이 브라우저에서는 바로 저장이 안 될 수 있어요. 아래 이미지를 길게 눌러 저장해 주세요.</p>
    <img id="storyImg" alt="스토리 이미지">
  </div>
  <div class="sub-actions" id="subActions">
    <button id="savePhoto" disabled>원본 사진 저장</button>
    <button id="addArchive" hidden>아카이브에 추가</button>
  </div>
  <a class="link" href="archive.html">전체 아카이브 보기 →</a>
</main>

<script src="config.js?v=20261027144302"></script>
<script src="lib/supabase.min.js?v=20261027144302"></script>
<script src="common.js?v=20261027144302"></script>
<script>
(async function () {
  const { C, db, photoUrl, esc } = window.Booth;
  const $ = id => document.getElementById(id);
  const eventLine = [C.EVENT_TITLE, C.EVENT_SUB].filter(Boolean).join(' · ');
  $('sub').textContent = eventLine;

  const id = new URLSearchParams(location.search).get('id');
  const { data: p, error } = id
    ? await db.rpc('get_photo', { p_id: id }).maybeSingle()
    : { data: null, error: null };
  if (error || !p) {
    $('who').textContent = '사진을 찾을 수 없어요';
    $('photo').remove();
    $('steps').remove();
    $('subActions').remove();
    return;
  }

  const src = photoUrl(p.path);
  $('photo').src = src;
  $('who').innerHTML = esc(p.name) + (p.affiliation ? `<span>${esc(p.affiliation)}</span>` : '');
  const addBtn = $('addArchive');
  addBtn.hidden = false;
  if (p.archived) { addBtn.textContent = '✓ 아카이브에 올라가 있어요'; addBtn.disabled = true; }
  addBtn.onclick = async () => {
    addBtn.disabled = true;
    addBtn.textContent = '추가하는 중…';
    const { error } = await db.rpc('archive_photo', { p_id: p.id });
    if (error) { addBtn.disabled = false; addBtn.textContent = '다시 시도'; return; }
    addBtn.textContent = '✓ 아카이브에 추가됐어요';
  };

  const fileBase = `${(C.EVENT_TITLE || 'photo').replace(/\s+/g, '-').toLowerCase()}-${p.id.slice(0, 8)}`;

  // 원본 사진 + 스토리용(1080×1920) 이미지를 미리 준비 — 공유는 탭 직후 바로 호출해야 함
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.src = src;
  await img.decode();
  const photoBlob = await (await fetch(src)).blob();
  const photoFile = new File([photoBlob], fileBase + '.jpg', { type: 'image/jpeg' });

  try { await document.fonts.load('700 72px Pretendard'); await document.fonts.load('500 40px Pretendard'); } catch {}
  const W = 1080, H = 1920;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const g = cv.getContext('2d');
  const css = getComputedStyle(document.documentElement);
  const bg = css.getPropertyValue('--bg').trim() || '#f2f1ee';
  const fg = css.getPropertyValue('--fg').trim() || '#141414';
  const muted = css.getPropertyValue('--muted').trim() || '#8a8780';
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  const pw = 920, ph = pw * C.OUTPUT_H / C.OUTPUT_W, px = (W - pw) / 2, py = 360;
  g.drawImage(img, px, py, pw, ph);
  g.textAlign = 'center';
  g.fillStyle = muted;
  g.font = '600 34px Pretendard, sans-serif';
  g.fillText(eventLine.toUpperCase().split('').join(' '), W / 2, 220);
  g.fillStyle = fg;
  g.font = '700 72px Pretendard, sans-serif';
  g.fillText(p.name, W / 2, py + ph + 140, pw);
  if (p.affiliation) {
    g.fillStyle = muted;
    g.font = '500 40px Pretendard, sans-serif';
    g.fillText(p.affiliation, W / 2, py + ph + 210, pw);
  }
  const storyBlob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.92));
  const storyFile = new File([storyBlob], fileBase + '-story.jpg', { type: 'image/jpeg' });
  $('storyImg').src = URL.createObjectURL(storyBlob);

  const canShareFiles = !!(navigator.canShare && navigator.canShare({ files: [storyFile] }));

  function download(file) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file);
    a.download = file.name;
    a.click();
  }

  async function share(file) {
    if (!canShareFiles) { download(file); $('storyPreview').classList.add('show'); return true; }
    try {
      await navigator.share({ files: [file] });
      return true;
    } catch (e) {
      if (e.name !== 'AbortError') $('storyPreview').classList.add('show');
      return false;
    }
  }

  // 1단계 끝나면 2단계(인스타 열기)를 강조
  function step1Done() {
    $('step1').classList.add('done');
    $('shareStory').classList.remove('primary');
    $('shareStory').textContent = '✓ 저장했어요 · 다시 저장';
    $('step2').classList.remove('dim');
    $('openIg').classList.add('primary');
  }

  $('shareStory').onclick = async () => { if (await share(storyFile)) step1Done(); };
  $('savePhoto').onclick = () => share(photoFile);
  $('shareStory').disabled = $('savePhoto').disabled = false;
  if (!canShareFiles) {
    $('hint1').textContent = '아래 이미지를 길게 눌러 사진에 저장해 주세요.';
    $('storyPreview').classList.add('show');
  }
})();
</script>
</body>
</html>
