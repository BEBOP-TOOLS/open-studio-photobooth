<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Booth</title>
<link rel="stylesheet" href="style.css?v=20261027144634">
<style>
  body { overflow: hidden; user-select: none; }
  .app {
    height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 28px; padding: 32px 24px 32px;
  }
  .stage {
    position: relative;
    height: calc(100vh - 32px - 32px - 28px - 120px);
    aspect-ratio: 1 / 1;
    max-width: 100%;
  }
  .stage canvas { width: 100%; height: 100%; display: block; }
  .count {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    font-size: 26vh; font-weight: 700; color: #fff;
    text-shadow: 0 0 40px rgba(0,0,0,.35);
    pointer-events: none;
  }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .flash.on { animation: flash .5s ease-out; }
  @keyframes flash { from { opacity: 1; } to { opacity: 0; } }
  .camera-msg {
    position: absolute; inset: 0; display: grid; place-items: center;
    text-align: center; color: var(--muted); padding: 24px; line-height: 1.6;
  }

  /* 하단 컨트롤 (촬영 버튼 / 확인 버튼) */
  .controls { height: 120px; display: grid; place-items: center; }
  .step { display: none; }
  .controls .step.active { display: flex; gap: 12px; align-items: center; }

  /* 아이폰 스타일 셔터 */
  /* 셔터 양옆: 필터 / 갤러리 */
  .controls .live-row.active {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 44px; width: 440px;
  }
  .side-wrap { position: relative; display: flex; }
  .side-wrap.left { justify-content: flex-end; }
  .side-wrap.right { justify-content: flex-start; }
  .side {
    width: 56px; height: 56px; padding: 0; border-radius: 50%;
    display: grid; place-items: center; color: #fff; background: transparent;
    border: 0; text-decoration: none; transition: transform .12s, background .3s, color .3s;
    position: relative;
  }
  .side:active { transform: scale(.94); }
  .side.tool { border: 1.5px solid #fff; }
  .side.solid { background: #fff; color: #000; }
  .side:disabled { opacity: .3; cursor: default; }

  /* 호버 시 느린 모션 */
  .side svg, .heart svg { transition: transform .9s cubic-bezier(.2, .8, .2, 1); }
  /* 필터 토글: fisheye(바깥 화살표) ↔ wide(안쪽 화살표) */
  #filterBtn { display: block; }
  #filterBtn svg {
    position: absolute; left: 50%; top: 50%; margin: -18px 0 0 -18px;
    transition: opacity .6s ease, transform .9s cubic-bezier(.2, .8, .2, 1);
  }
  #filterBtn .ico-wide { opacity: 0; transform: scale(.6) rotate(-45deg); }
  #filterBtn[data-mode=wide] .ico-fisheye { opacity: 0; transform: scale(1.4) rotate(45deg); }
  #filterBtn[data-mode=wide] .ico-wide { opacity: 1; transform: none; }
  #filterBtn[data-mode=fisheye]:hover .ico-fisheye { transform: scale(1.14); }
  #filterBtn[data-mode=wide]:hover .ico-wide { transform: scale(.86); }
  #galleryBtn:hover svg { transform: rotate(60deg) scale(1.08); }
  .side.back:hover svg { transform: translateX(-3px); }
  .side.solid:not(:disabled):hover svg { transform: translateX(3px); }

  /* 검은 말풍선 */
  [data-tip]::after, [data-tip]::before {
    position: absolute; left: 50%; pointer-events: none; opacity: 0;
    transition: opacity .35s ease, transform .35s ease;
  }
  [data-tip]::after {
    content: attr(data-tip); bottom: calc(100% + 12px); transform: translate(-50%, 4px);
    background: #000; color: #fff; border: 1px solid rgba(255,255,255,.28); border-radius: 999px;
    padding: 5px 12px; font-size: 12px; font-weight: 500; letter-spacing: .04em; white-space: nowrap;
  }
  [data-tip]:hover::after { opacity: 1; transform: translate(-50%, 0); }
  [data-tip]:disabled::after { display: none; }

  /* 촬영 후: 다시 찍기 / 하트 (같은 크기, 가운데) */
  .controls .review-row.active { gap: 28px; justify-content: center; }
  .round {
    width: 64px; height: 64px; padding: 0; border-radius: 50%; border: 1.5px solid #fff;
    background: transparent; color: #fff; display: grid; place-items: center; position: relative;
  }
  .round svg { transition: transform .9s cubic-bezier(.2, .8, .2, 1); }
  .round.back:hover svg { transform: translateX(-3px); }
  .heart path { transition: fill .6s ease; }
  .heart:hover path { fill: currentColor; }
  .heart:hover svg { transform: scale(1.1); }

  /* 오버레이가 뜰 때 '뽕' (짧게 올라오며 빠르게 페이드인) */
  @keyframes pop-in {
    from { opacity: 0; transform: translateY(10px) scale(.97); }
    to { opacity: 1; transform: none; }
  }
  .sheet.active > *, .done-layer.active > .pop {
    animation: pop-in .36s cubic-bezier(.2, .9, .3, 1.25) both;
  }
  .sheet.active > :nth-child(2), .done-layer.active > .pop:nth-child(2) { animation-delay: .05s; }
  .sheet.active > :nth-child(3), .done-layer.active > .pop:nth-child(3) { animation-delay: .1s; }
  .sheet.active > :nth-child(4), .done-layer.active > .pop:nth-child(4) { animation-delay: .15s; }

  .shutter {
    width: 84px; height: 84px; padding: 0;
    border-radius: 50%; border: 4px solid #fff;
    background: transparent; position: relative;
  }
  .shutter::after {
    content: ''; position: absolute; inset: 4px; border-radius: 50%;
    background: #fff; transition: inset .12s, opacity .12s;
  }
  .shutter:hover::after { opacity: .9; }
  .shutter:active { transform: none; }
  .shutter:active::after { inset: 8px; }
  .shutter.busy::after { inset: 8px; opacity: .5; }

  /* 입력·완료 단계: 화면 전체 오버레이 */
  .sheet.active {
    display: flex; position: fixed; inset: 0; z-index: 5;
    flex-direction: column; align-items: center; justify-content: center; gap: 28px;
    background: rgba(0,0,0,.82); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    padding: 24px; text-align: center;
  }
  .sheet > *, .sheet input[type=text] { width: min(440px, 100%); }

  /* 이름·소속 입력 */
  .sheet > .prompt, .sheet > .tags { width: min(680px, 100%); }
  .prompt { display: flex; align-items: baseline; gap: 18px; }
  .lead { font-family: var(--mono); font-size: 42px; font-weight: 500; letter-spacing: -0.01em; white-space: nowrap; }
  .field { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; border-bottom: 2px solid #fff; }
  .sheet .field input[type=text] {
    flex: 1; min-width: 0; width: auto; border: 0; text-align: left; font-size: 40px; padding: 4px 0;
    font-family: var(--mono); font-weight: 500;
  }
  .ime {
    flex: none; width: 32px; height: 32px; padding: 0; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.45); background: transparent; color: #fff;
    font-size: 13px; font-weight: 600; opacity: .75;
  }
  .ime:hover { opacity: 1; }
  .icon-row { display: flex; justify-content: center; gap: 20px; }
  .sheet > .icon-row { width: auto; }
  .tags {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
    max-height: 210px; overflow-y: auto; padding: 8px 6px;
  }
  .tags[hidden] { display: none; }
  .tags button {
    position: relative; padding: 7px 14px; font-size: 14px; font-weight: 500;
    border-color: rgba(255,255,255,.3);
    transition: border-color .2s, background .2s, color .2s, transform .25s cubic-bezier(.2, .8, .2, 1);
  }
  .tags button:hover { border-color: #fff; }
  .tags button.on { background: #fff; color: #000; border-color: #fff; }
  .tags button.tick { animation: tick .22s ease-out; }
  @keyframes tick { 40% { scale: 1.1; } 100% { scale: 1; } }
  /* 선택된 태그 우측 상단 x */
  .tags .x {
    display: none; position: absolute; top: -6px; right: -6px; width: 18px; height: 18px;
    border-radius: 50%; background: #000; color: #fff; border: 1px solid #fff;
    font-size: 11px; line-height: 1; place-items: center;
  }
  .tags button.on .x { display: grid; }
  .sheet input[type=text]::placeholder { color: #4a4a4a; }
  .sheet h1 { font-size: 40px; line-height: 1.2; margin: 0; font-weight: 700; letter-spacing: -0.02em; }
  .sheet p { margin: 0; color: var(--muted); font-size: 17px; line-height: 1.6; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row button { flex: 1; }
  .qr { width: 220px !important; height: 220px; background: #fff; padding: 12px; border-radius: 12px; }
  .qr svg, .qr img { width: 100%; height: 100%; display: block; }
  .err { color: var(--danger) !important; }


  /* 완료: 사진을 위로 밀어 갤러리에 던져 넣기 */
  .done-layer.active {
    display: flex; position: fixed; inset: 0; z-index: 16;
    flex-direction: column; align-items: center; justify-content: flex-end; gap: 18px;
    padding: 24px 24px 32px; touch-action: none;
    background: linear-gradient(transparent 28%, rgba(0,0,0,.9) 46%, #000 60%);
  }
  .done-layer h1 { font-family: var(--mono); font-weight: 500; font-size: 30px; margin: 0; text-align: center; }
  .throw-photo {
    width: 180px; height: 180px; border-radius: 50%; overflow: hidden; cursor: grab;
    box-shadow: 0 0 0 1px rgba(255,255,255,.15); will-change: transform; touch-action: none;
  }
  .throw-photo.dragging { cursor: grabbing; }
  .throw-photo img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .throw-hint { font-family: var(--mono); font-size: 13px; color: var(--muted); margin: 0; letter-spacing: .02em; }
  .throw-hint.ok { color: #fff; }
  .done-bottom { display: flex; align-items: center; gap: 16px; margin-top: 10px; }
  .done-bottom .qr { width: 92px !important; height: 92px; padding: 7px; border-radius: 10px; }
  .done-bottom p { font-family: var(--mono); font-size: 13px; line-height: 1.5; margin: 0; text-align: left; color: #fff; }
  .done-layer #restart { position: absolute; right: 28px; bottom: 32px; }
  .flying { position: fixed; left: 0; top: 0; z-index: 17; border-radius: 50%; overflow: hidden; pointer-events: none; }
  .flying img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* 꾹 눌러 전체화면: 누르는 동안 원이 차오름 */
  .hold {
    position: fixed; left: 0; top: 0; z-index: 30; width: 64px; height: 64px; margin: -32px 0 0 -32px;
    pointer-events: none; opacity: 0; transition: opacity .15s;
  }
  .hold.on { opacity: 1; }
  .hold circle { fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; }
  .hold .bg { stroke: rgba(255,255,255,.25); }
  .hold span {
    position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    font-family: var(--mono); font-size: 11px; white-space: nowrap; color: #fff;
  }

  /* 숨김 툴바: 화면 맨 위로 커서를 올리면 나타남 */
  .toolbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; justify-content: center; gap: 8px; padding: 10px;
    background: rgba(18,18,18,.88); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    transform: translateY(-100%); transition: transform .25s ease;
  }
  .toolbar.show { transform: none; }
  .toolbar button { padding: 7px 14px; font-size: 13px; font-weight: 500; border-color: rgba(255,255,255,.35); }

  /* 갤러리: 촬영 화면 위에 겹쳐 띄움 (전체화면 유지) */
  .archive-layer {
    position: fixed; inset: 0; z-index: 15; background: #000;
    opacity: 0; pointer-events: none; transition: opacity .35s ease;
  }
  .archive-layer.open { opacity: 1; pointer-events: auto; }
  .archive-layer iframe { width: 100%; height: 100%; border: 0; display: block; }

  /* 설정 */
  .settings {
    position: fixed; top: 0; right: 0; bottom: 0; width: 340px;
    background: var(--panel); border-left: 1px solid var(--line);
    padding: 24px; overflow-y: auto; transform: translateX(100%);
    transition: transform .25s; z-index: 10; font-size: 14px;
  }
  .settings.open { transform: none; }
  .settings h2 { font-size: 16px; margin: 0 0 16px; display: flex; justify-content: space-between; align-items: center; }
  .settings label { display: block; margin-bottom: 14px; }
  .settings .lab { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .settings .lab span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
  .settings input[type=range] { width: 100%; accent-color: #fff; }
  .settings select { width: 100%; font: inherit; padding: 6px; }
  .settings button { padding: 8px 14px; font-size: 14px; }
  .settings a { color: var(--fg); }
  .settings hr { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }
  .settings .row { margin: 0; }
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <canvas id="view"></canvas>
    <div class="camera-msg" id="cameraMsg">카메라를 켜는 중…</div>
    <div class="count" id="count"></div>
    <div class="flash" id="flash"></div>
  </div>

  <div class="controls">
    <section class="step active live-row" data-step="live">
      <div class="side-wrap left">
        <button class="side" id="filterBtn" aria-label="필터 전환" data-tip="fisheye" data-mode="fisheye">
          <svg class="ico-fisheye" viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 9V4h5M4 4l5.5 5.5"/><path d="M20 9V4h-5M20 4l-5.5 5.5"/>
            <path d="M4 15v5h5M4 20l5.5-5.5"/><path d="M20 15v5h-5M20 20l-5.5-5.5"/>
          </svg>
          <svg class="ico-wide" viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 4.5V10H4.5M4 4l6 6"/><path d="M14 4.5V10h5.5M20 4l-6 6"/>
            <path d="M10 19.5V14H4.5M4 20l6-6"/><path d="M14 19.5V14h5.5M20 20l-6-6"/>
          </svg>
        </button>
      </div>
      <button class="shutter" id="shutter" aria-label="촬영"></button>
      <div class="side-wrap right">
        <a class="side" id="galleryBtn" href="archive.html" aria-label="갤러리" data-tip="gallery">
          <svg viewBox="0 0 56 56" width="52" height="52" fill="#fff">
            <circle cx="28" cy="28" r="7"/>
            <circle cx="45" cy="28" r="6.2"/><circle cx="36.5" cy="42.7" r="6.2"/><circle cx="19.5" cy="42.7" r="6.2"/>
            <circle cx="11" cy="28" r="6.2"/><circle cx="19.5" cy="13.3" r="6.2"/><circle cx="36.5" cy="13.3" r="6.2"/>
          </svg>
        </a>
      </div>
    </section>
    <section class="step review-row" data-step="review">
      <button class="round back" id="retake" aria-label="다시 찍기" data-tip="retake"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg></button>
      <button class="round heart" id="accept" aria-label="좋아요" data-tip="keep"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 20.3S4.5 15.7 4.5 10.1A4.2 4.2 0 0 1 12 7.5a4.2 4.2 0 0 1 7.5 2.6c0 5.6-7.5 10.2-7.5 10.2z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg></button>
    </section>
  </div>
</div>

<section class="step sheet" data-step="name">
  <div class="prompt">
    <span class="lead">Welcome,</span>
    <label class="field">
      <input type="text" id="name" maxlength="40" autocomplete="off" spellcheck="false" lang="en">
      <button type="button" class="ime" id="nameIme" title="한/영 전환">A</button>
    </label>
  </div>
  <div class="icon-row">
    <button class="side tool back" data-back="review" aria-label="이전" data-tip="back"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg></button>
    <button class="side solid" id="nameNext" aria-label="다음" data-tip="next" disabled><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></button>
  </div>
</section>

<section class="step sheet" data-step="affil">
  <div class="prompt">
    <span class="lead">from</span>
    <label class="field">
      <input type="text" id="affil" maxlength="60" autocomplete="off" spellcheck="false" lang="en">
      <button type="button" class="ime" id="affilIme" title="한/영 전환">A</button>
    </label>
  </div>
  <div class="tags" id="tags"></div>
  <div class="icon-row">
    <button class="side tool" id="affilSkip" aria-label="건너뛰기" data-tip="skip"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></button>
    <button class="side solid" id="affilDone" aria-label="완료" data-tip="done"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
  </div>
</section>

<section class="step sheet" data-step="uploading">
  <h1 class="mono" style="font-weight:500">Saving…</h1>
</section>

<section class="step sheet" data-step="error">
  <h1>저장하지 못했어요</h1>
  <p class="err" id="errMsg"></p>
  <div class="row">
    <button id="giveUp">처음으로</button>
    <button class="primary" id="retry">다시 시도</button>
  </div>
  <button class="ghost" id="saveLocal">사진 내려받기</button>
</section>

<section class="step done-layer" data-step="done" id="doneLayer">
  <h1 class="pop" id="doneTitle">Nice to meet you!</h1>
  <div class="throw-photo pop" id="throwPhoto"><img id="throwImg" alt=""></div>
  <p class="throw-hint pop" id="throwHint">↑ swipe up to add it to the gallery</p>
  <div class="done-bottom pop">
    <div class="qr" id="qr"></div>
    <p>scan and download<br>your image</p>
  </div>
  <button class="side tool" id="restart" aria-label="처음으로" data-tip="new photo"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="4.5" fill="currentColor" stroke="none"/></svg></button>
</section>

<div class="hold" id="hold">
  <svg viewBox="0 0 64 64" width="64" height="64">
    <circle class="bg" cx="32" cy="32" r="26"/>
    <circle id="holdArc" cx="32" cy="32" r="26" transform="rotate(-90 32 32)" stroke-dasharray="163.4" stroke-dashoffset="163.4"/>
  </svg>
  <span id="holdLabel">fullscreen</span>
</div>
<div class="toolbar" id="toolbar">
  <button id="fsBtn" type="button">전체화면</button>
  <button id="gear" type="button">효과 설정</button>
</div>
<div class="archive-layer" id="archiveLayer"><iframe id="archiveFrame" title="Archive"></iframe></div>
<aside class="settings" id="settings">
  <h2>효과 설정 <button id="closeSettings">닫기</button></h2>
  <div id="sliders"></div>
  <label><div class="lab"><span>테두리 색</span></div><input type="color" id="edgeColor"></label>
  <label><input type="checkbox" id="mirror"> 좌우 반전 (거울처럼)</label>
  <hr>
  <label><div class="lab"><span>카메라</span></div><select id="camSelect"></select></label>
  <hr>
  <div class="row">
    <button id="resetFx">기본값으로</button>
    <button id="copyFx">설정값 복사</button>
  </div>
  <hr>
  <p><a href="archive.html" target="_blank">아카이브 열기 ↗</a></p>
  <p style="color:var(--muted)">S: 설정 열기/닫기 · F: 전체화면</p>
</aside>

<script src="config.js?v=20261027144634"></script>
<script src="lib/supabase.min.js?v=20261027144634"></script>
<script src="lib/qrcode.min.js?v=20261027144634"></script>
<script src="common.js?v=20261027144634"></script>
<script src="filter.js?v=20261027144634"></script>
<script src="hangul.js?v=20261027144634"></script>
<script>
(function () {
  const { C, db, shareUrl } = window.Booth;
  const $ = id => document.getElementById(id);
  const FX_KEY = 'booth.fx.v4', CAM_KEY = 'booth.cam';

  const canvas = $('view');
  canvas.width = C.OUTPUT_W;
  canvas.height = C.OUTPUT_H;
  const filter = new BoothFilter(canvas);
  const video = document.createElement('video');
  video.muted = true; video.playsInline = true;

  Booth.ringText($('stage'));

  // ---------- 효과 설정 ----------
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  let fx = { ...BoothFilter.DEFAULTS };
  try { Object.assign(fx, JSON.parse(store.get(FX_KEY) || '{}')); } catch {}
  const saveFx = () => store.set(FX_KEY, JSON.stringify(fx));

  function buildSliders() {
    const box = $('sliders');
    box.innerHTML = '';
    for (const p of BoothFilter.PARAMS) {
      const l = document.createElement('label');
      l.innerHTML = `<div class="lab"><span>${p.label}</span><span></span></div>
        <input type="range" min="${p.min}" max="${p.max}" step="${p.step}">`;
      const input = l.querySelector('input'), out = l.querySelector('.lab span:last-child');
      input.value = fx[p.key];
      out.textContent = fx[p.key];
      input.oninput = () => { fx[p.key] = +input.value; out.textContent = input.value; saveFx(); };
      box.appendChild(l);
    }
    $('edgeColor').value = fx.edgeColor;
    $('mirror').checked = fx.mirror;
  }
  $('edgeColor').oninput = e => { fx.edgeColor = e.target.value; saveFx(); };
  $('mirror').onchange = e => { fx.mirror = e.target.checked; saveFx(); };
  $('resetFx').onclick = () => applyPreset(presetId);

  // ---------- 필터 목록 ----------
  const PRESET_KEY = 'booth.preset';
  let presetId = store.get(PRESET_KEY) || BoothFilter.PRESETS[0].id;
  function applyPreset(id) {
    const pr = BoothFilter.PRESETS.find(p => p.id === id) || BoothFilter.PRESETS[0];
    presetId = pr.id;
    store.set(PRESET_KEY, presetId);
    fx = { ...pr.fx };
    saveFx();
    buildSliders();
    renderFilterBtn();
  }
  // 누를 때마다 다음 필터로 전환 (아이콘·말풍선은 현재 필터)
  function renderFilterBtn() {
    $('filterBtn').dataset.mode = presetId;
    $('filterBtn').dataset.tip = presetId;
  }
  $('filterBtn').onclick = () => {
    const list = BoothFilter.PRESETS, i = list.findIndex(p => p.id === presetId);
    applyPreset(list[(i + 1) % list.length].id);
  };
  renderFilterBtn();
  $('copyFx').onclick = () => navigator.clipboard.writeText(JSON.stringify(fx, null, 2));
  buildSliders();

  const toggleSettings = open => $('settings').classList.toggle('open', open);
  $('gear').onclick = () => { toggleSettings(true); toolbar.classList.remove('show'); };
  $('closeSettings').onclick = () => toggleSettings(false);

  // ---------- 카메라 ----------
  let stream;
  async function startCamera(deviceId) {
    if (stream) stream.getTracks().forEach(t => t.stop());
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          deviceId: deviceId ? { exact: deviceId } : undefined,
          width: { ideal: 1920 }, height: { ideal: 1080 },
        },
      });
    } catch (e) {
      $('cameraMsg').textContent = '카메라를 켤 수 없어요. 브라우저 주소창에서 카메라 권한을 허용해 주세요. (' + e.name + ')';
      return;
    }
    video.srcObject = stream;
    await video.play();
    $('cameraMsg').style.display = 'none';

    const cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    const current = stream.getVideoTracks()[0].getSettings().deviceId;
    $('camSelect').innerHTML = cams.map((c, i) =>
      `<option value="${c.deviceId}" ${c.deviceId === current ? 'selected' : ''}>${Booth.esc(c.label || '카메라 ' + (i + 1))}</option>`
    ).join('');
  }
  $('camSelect').onchange = e => { store.set(CAM_KEY, e.target.value); startCamera(e.target.value); };
  startCamera(store.get(CAM_KEY));

  let frozen = false, archiveOpen = false;
  (function loop(t) {
    if (!frozen && !archiveOpen) filter.render(video, fx, t / 1000);
    requestAnimationFrame(loop);
  })(0);

  // ---------- 흐름 ----------
  let state = 'live', photoBlob = null, savedId = null, lastPhoto = null, counting = false;
  let restartTimer = null, idleTimer = null;

  function go(next) {
    state = next;
    if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
    document.querySelectorAll('.step').forEach(s => s.classList.toggle('active', s.dataset.step === next));
    frozen = next !== 'live';
    clearInterval(restartTimer);
    clearTimeout(idleTimer);
    if (['review', 'name', 'affil', 'error'].includes(next)) idleTimer = setTimeout(reset, 120000);
    if (next === 'gallery') idleTimer = setTimeout(reset, 180000);
    if (next === 'live' && archiveOpen) closeArchive();
    if (next === 'name') setTimeout(() => $('name').focus(), 50);
    if (next === 'affil') setTimeout(() => $('affil').focus(), 50);
  }

  // ---------- 이름·소속 입력 (한/영 전환 + 회사 태그) ----------
  const nameIn = HangulInput.attach($('name'), $('nameIme'), v => { $('nameNext').disabled = !v.trim(); });
  const affilIn = HangulInput.attach($('affil'), $('affilIme'), v => filterTags(v));
  let companies = [...(C.COMPANIES || [])];
  function mergeCompanies(names) {
    const seen = new Set(companies.map(c => c.toLowerCase()));
    for (const n of names) if (n && !seen.has(n.toLowerCase())) { seen.add(n.toLowerCase()); companies.push(n); }
  }
  async function loadCompanies() {
    const { data } = await db.rpc('list_affiliations');
    if (data) { mergeCompanies(data.map(r => r.name)); renderTags(); }
  }
  const setAffil = v => { $('affil').value = v; $('affil').dispatchEvent(new Event('input')); $('affil').focus(); };
  function renderTags() {
    $('tags').innerHTML = companies.map(c =>
      `<button type="button" data-name="${Booth.esc(c)}">${Booth.esc(c)}<span class="x" aria-label="지우기">×</span></button>`).join('');
    $('tags').querySelectorAll('button').forEach(b => {
      b.onclick = e => setAffil(e.target.closest('.x') ? '' : b.dataset.name);
      b.addEventListener('pointerenter', () => {            // 지나갈 때 '톡'
        b.classList.remove('tick'); void b.offsetWidth; b.classList.add('tick');
      });
    });
    filterTags($('affil').value);
  }
  // 커서 근처 태그가 살짝 커지며 커서 쪽으로 끌려옴
  $('tags').addEventListener('pointermove', e => {
    $('tags').querySelectorAll('button:not([hidden])').forEach(b => {
      const r = b.getBoundingClientRect();
      const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
      const k = Math.max(0, 1 - Math.hypot(dx, dy) / 150);
      b.style.transform = k ? `translate(${dx * k * 0.08}px, ${dy * k * 0.08}px) scale(${1 + k * 0.07})` : '';
    });
  });
  $('tags').addEventListener('pointerleave', () => $('tags').querySelectorAll('button').forEach(b => b.style.transform = ''));
  function filterTags(v) {
    const q = v.trim().toLowerCase();
    let shown = 0;
    $('tags').querySelectorAll('button').forEach(b => {
      const n = b.dataset.name.toLowerCase();
      const show = !q || n.includes(q) || n === q;
      b.hidden = !show;
      b.classList.toggle('on', n === q);
      if (show) shown++;
    });
    $('tags').hidden = !shown;
  }
  renderTags();
  loadCompanies();

  function reset() {
    photoBlob = null; savedId = null; lastPhoto = null;
    nameIn.reset(); affilIn.reset();
    $('nameNext').disabled = true;
    go('live');
  }

  function capture() {
    if (state !== 'live' || counting || !video.videoWidth) return;
    counting = true;
    $('shutter').classList.add('busy');
    let n = 3;
    $('count').textContent = n;
    const tick = setInterval(() => {
      n--;
      if (n > 0) { $('count').textContent = n; return; }
      clearInterval(tick);
      $('count').textContent = '';
      filter.render(video, fx, performance.now() / 1000);
      frozen = true;
      const f = $('flash'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
      canvas.toBlob(b => { photoBlob = b; counting = false; $('shutter').classList.remove('busy'); go('review'); }, 'image/jpeg', 0.9);
    }, 1000);
  }

  async function upload() {
    go('uploading');
    const name = $('name').value.trim();
    const typed = $('affil').value.trim();
    // 목록에 있는 회사면 정식 표기로 저장 (heaz → HEAZ)
    const affiliation = typed ? (companies.find(c => c.toLowerCase() === typed.toLowerCase()) || typed) : null;
    const id = crypto.randomUUID();
    const day = new Date().toISOString().slice(0, 10);
    const path = `${day}/${id}.jpg`;
    try {
      const up = await db.storage.from(C.BUCKET).upload(path, photoBlob, { contentType: 'image/jpeg' });
      if (up.error) throw up.error;
      const ins = await db.from('photos').insert({ id, name, affiliation, path });
      if (ins.error) throw ins.error;
    } catch (e) {
      $('errMsg').textContent = e.message || String(e);
      go('error');
      return;
    }
    savedId = id;
    lastPhoto = { id, name, affiliation, path, created_at: new Date().toISOString() };
    if (affiliation) { mergeCompanies([affiliation]); renderTags(); }
    showDone(name);
  }

  function showDone(name) {
    const qr = qrcode(0, 'M');
    qr.addData(shareUrl(savedId));
    qr.make();
    $('qr').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
    $('doneTitle').textContent = `Nice to meet you, ${name}!`;
    $('throwImg').src = URL.createObjectURL(photoBlob);
    resetThrow();
    go('done');
    openArchive('', 'preview');
    let left = 90;
    restartTimer = setInterval(() => { if (--left <= 0) reset(); }, 1000);
  }

  // ---------- 완료: 사진을 위로 밀어 갤러리에 던져 넣기 ----------
  const tp = $('throwPhoto');
  let thrown = false, td = null;
  const HINT = '↑ swipe up to add it to the gallery';
  function resetThrow() {
    thrown = false;
    tp.style.transition = ''; tp.style.transform = ''; tp.style.visibility = '';
    $('throwHint').textContent = HINT;
    $('throwHint').classList.remove('ok');
  }
  tp.addEventListener('pointerdown', e => {
    if (thrown) return;
    try { tp.setPointerCapture(e.pointerId); } catch {}
    td = { id: e.pointerId, sx: e.clientX, sy: e.clientY, lx: e.clientX, ly: e.clientY, lt: performance.now(), vx: 0, vy: 0 };
    tp.style.transition = 'none';
    tp.classList.add('dragging');
  });
  tp.addEventListener('pointermove', e => {
    if (!td || e.pointerId !== td.id) return;
    const now = performance.now(), dt = Math.max(now - td.lt, 1) / 1000;
    td.vx = td.vx * 0.5 + ((e.clientX - td.lx) / dt) * 0.5;
    td.vy = td.vy * 0.5 + ((e.clientY - td.ly) / dt) * 0.5;
    td.lx = e.clientX; td.ly = e.clientY; td.lt = now;
    const dx = e.clientX - td.sx, dy = e.clientY - td.sy;
    tp.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx * 0.05}deg)`;
  });
  function endThrowDrag(e) {
    if (!td || e.pointerId !== td.id) return;
    tp.classList.remove('dragging');
    const dy = e.clientY - td.sy, { vx, vy } = td;
    td = null;
    if (vy < -600 || dy < -150) throwIt(vx, vy);
    else { tp.style.transition = 'transform .55s cubic-bezier(.2, 1.5, .4, 1)'; tp.style.transform = ''; }
  }
  tp.addEventListener('pointerup', endThrowDrag);
  tp.addEventListener('pointercancel', endThrowDrag);

  function throwIt(vx, vy) {
    thrown = true;
    const r = tp.getBoundingClientRect();
    const fly = document.createElement('div');
    fly.className = 'flying';
    fly.innerHTML = `<img src="${$('throwImg').src}" alt="">`;
    document.body.appendChild(fly);
    tp.style.visibility = 'hidden';

    // 던진 속도를 살린 곡선으로 갤러리 가운데까지
    const p0 = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    const p2 = { x: innerWidth / 2, y: innerHeight * 0.25 };   // archive.html VIEW.preview.cy 와 맞춤
    const p1 = { x: p0.x + vx * 0.18, y: Math.min(p0.y + vy * 0.18, p2.y + 40) };
    const s0 = r.width, s1 = (innerWidth < 600 ? 104 : 195) * 0.8 * 0.62;
    const T = 560, start = performance.now();
    (function step(now) {
      const t = Math.min((now - start) / T, 1), e = 1 - Math.pow(1 - t, 3), u = 1 - e;
      const x = u * u * p0.x + 2 * u * e * p1.x + e * e * p2.x;
      const y = u * u * p0.y + 2 * u * e * p1.y + e * e * p2.y;
      const sz = s0 + (s1 - s0) * e;
      fly.style.width = fly.style.height = sz + 'px';
      fly.style.transform = `translate(${x - sz / 2}px, ${y - sz / 2}px) rotate(${(1 - e) * vx * 0.01}deg)`;
      if (t < 1) return requestAnimationFrame(step);
      fly.remove();
      frame.contentWindow?.postMessage({ type: 'booth:insert', photo: lastPhoto }, location.origin);
      $('throwHint').textContent = 'added to the gallery ✓';
      $('throwHint').classList.add('ok');
    })(start);

    db.rpc('archive_photo', { p_id: savedId }).then(({ error }) => {
      if (error) { $('throwHint').textContent = 'couldn’t add — try again'; thrown = false; tp.style.visibility = ''; tp.style.transform = ''; }
    });
  }

  // 갤러리 쪽을 확대(핀치)하거나 더블클릭하면 갤러리 보기로
  let pinch = 0;
  function enterGallery() {
    if (state !== 'done') return;
    go('gallery');
    openArchive('', 'full');
  }
  $('doneLayer').addEventListener('wheel', e => {
    e.preventDefault();
    if (e.ctrlKey && e.deltaY < 0) { pinch += -e.deltaY; if (pinch > 25) { pinch = 0; enterGallery(); } }
  }, { passive: false });
  $('doneLayer').addEventListener('dblclick', e => { if (e.clientY < innerHeight * 0.55) enterGallery(); });

  $('shutter').onclick = capture;
  $('retake').onclick = reset;
  $('accept').onclick = () => go('name');
  $('name').oninput = e => { $('nameNext').disabled = !e.target.value.trim(); };
  $('nameNext').onclick = () => { if ($('name').value.trim()) go('affil'); };
  $('affilSkip').onclick = () => { $('affil').value = ''; upload(); };
  $('affilDone').onclick = upload;
  $('retry').onclick = upload;
  $('giveUp').onclick = reset;
  $('saveLocal').onclick = () => {
    if (!photoBlob) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(photoBlob);
    a.download = `booth-${$('name').value.trim() || 'photo'}-${Date.now()}.jpg`;
    a.click();
  };
  $('restart').onclick = reset;
  document.querySelectorAll('[data-back]').forEach(b => b.onclick = () => go(b.dataset.back));

  // ---------- 갤러리 (같은 페이지 위에 띄움) ----------
  // 미리 불러둠 (완료 화면 뒤에 바로 깔리도록)
  const frame = $('archiveFrame');
  let archiveMode = 'preview';
  const postMode = () => frame.contentWindow?.postMessage({ type: 'booth:mode', mode: archiveMode }, location.origin);
  frame.addEventListener('load', postMode);
  // 배포 버전을 붙여서 갤러리도 항상 최신 파일을 받게 함
  const ver = (document.querySelector('script[src*="config.js"]')?.src.match(/v=(\d+)/) || [])[1] || '';
  frame.src = 'archive.html?mode=preview&v=' + ver;
  function openArchive(hash = '', mode = 'full') {
    archiveMode = mode;
    postMode();
    if (hash) frame.contentWindow.location.hash = hash;
    archiveOpen = true;
    $('archiveLayer').classList.add('open');
    if (mode === 'full') frame.focus();
  }
  function closeArchive() {
    archiveOpen = false;
    $('archiveLayer').classList.remove('open');
    window.focus();
  }
  $('galleryBtn').onclick = e => { e.preventDefault(); openArchive(); };
  addEventListener('message', e => {
    if (e.origin !== location.origin || !e.data || e.data.type !== 'booth:close-archive') return;
    if (state === 'done' || state === 'gallery') reset(); else closeArchive();
  });

  // ---------- 전체화면 + 숨김 툴바 ----------
  const nativeFull = () => innerHeight >= screen.height - 2 && innerWidth >= screen.width - 2;
  const enterFs = () => { if (!document.fullscreenElement && !nativeFull()) document.documentElement.requestFullscreen?.().catch(() => {}); };
  const toggleFs = () => document.fullscreenElement ? document.exitFullscreen() : enterFs();
  // 브라우저 정책상 첫 클릭/키 입력 때 전체화면으로 전환 (페이지 열자마자는 불가)
  let autoFsDone = false, autoFsAt = -1;
  const autoFs = e => {
    if (autoFsDone) return;
    autoFsDone = true;
    autoFsAt = performance.now();
    if (e.target.closest && e.target.closest('.toolbar')) return;
    enterFs();
  };
  document.addEventListener('pointerdown', autoFs, true);
  document.addEventListener('keydown', autoFs, true);

  const toolbar = $('toolbar');
  let tbTimer = null;
  const showToolbar = ms => {
    toolbar.classList.add('show');
    clearTimeout(tbTimer);
    if (ms) tbTimer = setTimeout(() => { if (!toolbar.matches(':hover')) toolbar.classList.remove('show'); }, ms);
  };
  addEventListener('mousemove', e => { if (e.clientY <= 6) showToolbar(); });
  toolbar.addEventListener('mouseleave', () => showToolbar(400));
  document.addEventListener('fullscreenchange', () => {
    $('fsBtn').textContent = document.fullscreenElement ? '전체화면 끄기' : '전체화면';
    if (!document.fullscreenElement) showToolbar(3000);   // Esc로 나왔을 때 다시 켤 수 있게
  });
  $('fsBtn').onclick = toggleFs;

  // 빈 곳을 꾹 누르면(0.7초) 전체화면 켜기/끄기
  const HOLD_MS = 700, CIRC = 163.4;
  let hold = null;
  const cancelHold = () => {
    if (!hold) return;
    cancelAnimationFrame(hold.raf);
    hold = null;
    $('hold').classList.remove('on');
  };
  document.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest?.('button, a, input, label, .throw-photo, .settings, .toolbar, .tags')) return;
    cancelHold();
    hold = { x: e.clientX, y: e.clientY, t0: performance.now() };
    $('hold').style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
    $('holdLabel').textContent = document.fullscreenElement ? 'exit fullscreen' : 'fullscreen';
    $('holdArc').style.strokeDashoffset = CIRC;
    (function tick(now) {
      if (!hold) return;
      const k = Math.min((now - hold.t0) / HOLD_MS, 1);
      if (k > 0.15) $('hold').classList.add('on');     // 짧은 클릭엔 표시 안 함
      $('holdArc').style.strokeDashoffset = CIRC * (1 - k);
      if (k >= 1) {
        const justAuto = autoFsAt >= hold.t0 - 50;   // 이번 누름으로 이미 자동 전체화면이 켜지는 중이면 그대로 둠
        cancelHold();
        if (!justAuto) toggleFs();
        return;
      }
      hold.raf = requestAnimationFrame(tick);
    })(hold.t0);
  });
  document.addEventListener('pointermove', e => {
    if (hold && Math.hypot(e.clientX - hold.x, e.clientY - hold.y) > 10) cancelHold();
  });
  document.addEventListener('pointerup', cancelHold);
  document.addEventListener('pointercancel', cancelHold);

  document.addEventListener('keydown', e => {
    const typing = e.target.tagName === 'INPUT' && e.target.type === 'text';
    if (e.isComposing) return;
    if (typing) {
      if (e.key === 'Enter') {
        if (state === 'name') $('nameNext').click();
        else if (state === 'affil') upload();
      }
      return;
    }
    if (e.code === 'Space') {
      e.preventDefault();
      if (state === 'live') capture();
      else if (state === 'review') go('name');
      else if (state === 'done') reset();
    } else if (e.key === 'Escape') {
      if ($('settings').classList.contains('open')) toggleSettings(false);
      else if (state === 'review') reset();
    } else if (e.key === 's' || e.key === 'S' || e.key === 'ㄴ') {
      toggleSettings(!$('settings').classList.contains('open'));
    } else if (e.key === 'f' || e.key === 'F' || e.key === 'ㄹ') {
      toggleFs();
    }
  });
})();
</script>
</body>
</html>
