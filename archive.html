<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archive</title>
<link rel="stylesheet" href="style.css?v=20261027150121">
<style>
  html, body { overflow: hidden; overscroll-behavior: none; }

  /* 상단 오버레이 */
  .top {
    position: fixed; top: 0; left: 0; right: 0; z-index: 3;
    padding: calc(17vh - 0.6em) 24px 7vh; pointer-events: none; text-align: center;
    font-size: clamp(38px, 3.8vw, 60px);
    background: linear-gradient(#000 0%, rgba(0,0,0,.88) 72%, transparent);
  }
  .welcome {
    margin: 0; color: #fff; font-size: 1em; font-weight: 500;
    display: inline-flex; flex-direction: column; align-items: flex-start; gap: .28em;
  }
  /* 작은 WELCOME TO 위, BEBOP. 로고 아래 — 글자 간격을 벌려 B 왼쪽 끝 ~ P 오른쪽 끝에 맞춤 */
  .welcome span { font-family: var(--mono); font-size: .3em; display: flex; justify-content: space-between; white-space: pre; }
  .welcome img { height: .8em; width: auto; display: block; }

  /* 촬영으로 돌아가기 (작은 셔터 모양) */
  .bottom-fade {
    position: fixed; left: 0; right: 0; bottom: 0; height: 120px; z-index: 3; pointer-events: none;
    background: linear-gradient(transparent, rgba(0,0,0,.85));
  }
  .back {
    position: fixed; left: 50%; bottom: 24px; z-index: 3; transform: translateX(-50%);
    width: 56px; height: 56px; border-radius: 50%; border: 3px solid #fff;
  }
  .back::after { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: #fff; }
  .back:hover::after { opacity: .85; }
  .admin-link {
    position: fixed; right: 20px; bottom: 20px; z-index: 3;
    color: var(--muted); font-size: 12px; text-decoration: none; opacity: .4;
  }
  .admin-link:hover { opacity: 1; }

  /* 형광 오렌지 원형 커서 (드래그 중엔 손 모양) */
  .cursor {
    position: fixed; left: 0; top: 0; z-index: 4; pointer-events: none;
    width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%;
    background: #ff5a00; mix-blend-mode: screen;
    transition: width .2s, height .2s, margin .2s, opacity .15s;
    opacity: 0;
  }
  .cursor.on { opacity: 1; }
  .cursor.big { width: 72px; height: 72px; margin: -36px 0 0 -36px; }
  @media (hover: none) { .cursor { display: none; } }

  /* 허니콤 스테이지 */
  .stage {
    position: fixed; inset: 0; cursor: none; touch-action: none; user-select: none;
    -webkit-user-select: none;
  }
  .stage.dragging { cursor: grabbing; }
  .cell {
    position: absolute; left: 0; top: 0;
    border-radius: 50%; overflow: hidden; background: #0d0d0d;
    transform-origin: 50% 50%; will-change: transform;
  }
  .cell img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    pointer-events: none; -webkit-user-drag: none; will-change: transform;
  }
  .cell { box-shadow: 0 0 0 0 rgba(255,255,255,0); transition: box-shadow 1.2s ease; }
  .cell.hl { box-shadow: 0 0 0 3px #fff; transition: box-shadow .3s ease; }
  .label {
    position: fixed; left: 0; top: 0; z-index: 2; pointer-events: none;
    font-family: var(--mono); font-size: 13px; white-space: nowrap; transform: translate(-50%, 0);
    opacity: 0; transition: opacity .15s;
    background: rgba(0,0,0,.75); padding: 4px 10px; border-radius: 999px;
  }
  .label.show { opacity: 1; }
  .label span { color: var(--muted); margin-left: 6px; }
  .empty { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); }

  /* 크게 보기 */
  .lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,.94); z-index: 5;
    display: none; place-items: center; padding: 24px;
  }
  .lightbox.open { display: grid; }
  .lightbox .inner { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  /* 앞면: 사진 / 뒷면: 공유 QR — flip 버튼으로 뒤집기 */
  .flip-scene { perspective: 1800px; }
  .flip {
    position: relative; width: min(68vh, calc(100vw - 48px)); aspect-ratio: 1 / 1;
    transform-style: preserve-3d; transition: transform .9s cubic-bezier(.3, 1.3, .4, 1);
  }
  .flip.flipped { transform: rotateY(180deg); }
  /* 사진 위에서는 커서 대신 flip 아이콘 */
  .flip { cursor: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2236%22%20height%3D%2236%22%20viewBox%3D%22-2%20-2%2028%2028%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cg%20stroke%3D%22%23000%22%20stroke-width%3D%223.6%22%20stroke-opacity%3D%22.55%22%3E%3Cpath%20d%3D%22M4%2011a8%208%200%200%201%2014-4.5L20%208.5%22/%3E%3Cpath%20d%3D%22M20%204v4.5h-4.5%22/%3E%3Cpath%20d%3D%22M20%2013a8%208%200%200%201-14%204.5L4%2015.5%22/%3E%3Cpath%20d%3D%22M4%2020v-4.5h4.5%22/%3E%3C/g%3E%3Cg%20stroke%3D%22%23fff%22%20stroke-width%3D%221.6%22%3E%3Cpath%20d%3D%22M4%2011a8%208%200%200%201%2014-4.5L20%208.5%22/%3E%3Cpath%20d%3D%22M20%204v4.5h-4.5%22/%3E%3Cpath%20d%3D%22M20%2013a8%208%200%200%201-14%204.5L4%2015.5%22/%3E%3Cpath%20d%3D%22M4%2020v-4.5h4.5%22/%3E%3C/g%3E%3C/svg%3E") 18 18, pointer; }
  .face { position: absolute; inset: 0; border-radius: 50%; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  /* 뒷면: 같은 사진을 뒤에서 본 것처럼(좌우 반전) + 50% 블랙 */
  .face.face-back {
    transform: rotateY(180deg); overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5%;
  }
  .face.face-back > img { position: absolute; inset: 0; transform: scaleX(-1); z-index: 0; }
  .face.face-back::before { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,.5); z-index: 1; }
  .face.face-back > :not(img) { position: relative; z-index: 2; }
  .face.face-back .qrbox { width: 36%; aspect-ratio: 1 / 1; background: #fff; padding: 3%; border-radius: 6%; }
  .face.face-back .qrbox svg { width: 100%; height: 100%; display: block; }
  .face.face-back p { font-size: 15px; line-height: 1.5; color: #fff; }
  .lightbox img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
  .flip-btn {
    width: 48px; height: 48px; padding: 0; border-radius: 50%; border: 1.5px solid #fff;
    display: grid; place-items: center; color: #fff; background: transparent;
  }
  .flip-btn svg { transition: transform .9s cubic-bezier(.2, .8, .2, 1); }
  .flip-btn:hover svg { transform: translateX(-3px); }
  .lightbox p { text-align: center; font-family: var(--mono); font-size: 18px; margin: 0; }
  .lightbox p span { color: var(--muted); margin-left: 8px; }
  .admin-actions { display: none; gap: 8px; }
  body.admin .admin-actions { display: flex; }
  .admin-actions button { padding: 8px 18px; font-size: 14px; }
  .admin-actions .del { border-color: var(--danger); color: var(--danger); }
  .cell.is-hidden { opacity: .25; }
  .hidden-tag { color: var(--danger); font-size: 14px; margin-left: 8px; }

  /* 관리자 로그인 */
  dialog {
    background: var(--panel); color: var(--fg); border: 1px solid var(--line);
    border-radius: 16px; padding: 28px; width: min(360px, calc(100vw - 32px));
  }
  dialog::backdrop { background: rgba(0,0,0,.7); }
  dialog h2 { margin: 0 0 20px; font-size: 20px; }
  dialog input {
    width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; margin-bottom: 10px;
    background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 10px;
  }
  dialog .row { display: flex; gap: 8px; margin-top: 8px; }
  dialog .row button { flex: 1; padding: 12px; font-size: 15px; }
  dialog .msg { color: var(--danger); font-size: 14px; min-height: 20px; margin: 4px 0 0; }

  @media (max-width: 600px) {
    .top { padding: calc(16vh - 0.6em) 16px 6vh; font-size: 24px; }
  }
  @media (hover: none) { .stage { cursor: auto; } }

  /* 미리보기 모드: 촬영 완료 화면 뒤에 깔리는 갤러리 */
  body.preview .stage { pointer-events: none; }
  body.preview .back, body.preview .admin-link, body.preview .cursor,
  body.preview .bottom-fade, body.preview .label, body.preview .top { opacity: 0; pointer-events: none; }
  .back, .admin-link, .bottom-fade, .top { transition: opacity .4s ease; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<div class="label" id="label"></div>

<div class="top"><h1 class="welcome" id="welcome"></h1></div>
<div class="bottom-fade"></div>
<a class="back" href="index.html" aria-label="촬영으로 돌아가기" title="촬영으로 돌아가기"></a>
<a href="#" class="admin-link" id="adminLink">관리자</a>
<div class="cursor" id="cursor"></div>

<div class="lightbox" id="lb">
  <div class="inner">
    <div class="flip-scene">
      <div class="flip" id="lbFlip">
        <div class="face front" id="lbWrap"><img id="lbImg" alt=""></div>
        <div class="face face-back"><img id="lbImgBack" alt=""><div class="qrbox" id="lbQr"></div><p>scan and download<br>your image</p></div>
      </div>
    </div>
    <p id="lbCap"></p>
    <button class="flip-btn" id="lbBack" type="button" aria-label="갤러리로 돌아가기">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/>
      </svg>
    </button>
    <div class="admin-actions">
      <button id="lbHide" type="button">숨기기</button>
      <button class="del" id="lbDel" type="button">완전 삭제</button>
    </div>
  </div>
</div>

<dialog id="loginDlg">
  <form method="dialog" id="loginForm">
    <h2>관리자 로그인</h2>
    <input type="email" id="email" placeholder="이메일" autocomplete="username" required>
    <input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password" required>
    <p class="msg" id="loginMsg"></p>
    <div class="row">
      <button type="button" id="loginCancel">취소</button>
      <button type="submit" class="primary">로그인</button>
    </div>
  </form>
</dialog>

<script src="config.js?v=20261027150121"></script>
<script src="lib/supabase.min.js?v=20261027150121"></script>
<script src="lib/qrcode.min.js?v=20261027150121"></script>
<script src="common.js?v=20261027150121"></script>
<script>
(async function () {
  const { C, db, photoUrl, esc } = window.Booth;
  const $ = id => document.getElementById(id);
  $('welcome').innerHTML = `<span>${[...C.WELCOME_TEXT].map(ch => `<i style="font-style:normal">${esc(ch)}</i>`).join('')}</span><img src="assets/bebop-logo.svg" alt="BEBOP.">`;
  // 로고 SVG(viewBox 너비 497.4) 안에서 B 왼쪽 끝 = 1.0, P 오른쪽 끝 = 478.8
  const LOGO_B_LEFT = 1.0 / 497.4, LOGO_P_RIGHT = 478.8 / 497.4;
  function alignWelcome() {
    const span = $('welcome').querySelector('span'), img = $('welcome').querySelector('img');
    const w = img.getBoundingClientRect().width;
    if (!w) return;
    const cs = getComputedStyle(span), ctx = document.createElement('canvas').getContext('2d');
    ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    const t = C.WELCOME_TEXT, first = ctx.measureText(t[0]), last = ctx.measureText(t[t.length - 1]);
    const lb = -first.actualBoundingBoxLeft;                 // 첫 글자 왼쪽 여백
    const rb = last.width - last.actualBoundingBoxRight;     // 마지막 글자 오른쪽 여백
    span.style.marginLeft = (w * LOGO_B_LEFT - lb) + 'px';
    span.style.width = (w * (LOGO_P_RIGHT - LOGO_B_LEFT) + lb + rb) + 'px';
  }
  $('welcome').querySelector('img').addEventListener('load', alignWelcome);
  document.fonts.ready.then(alignWelcome);
  addEventListener('resize', alignWelcome);
  Booth.ringText($('lbWrap'));

  // ---------- 설정 ----------
  const SPIN_MIN = 6, SPIN_MAX = 16;  // 평소 회전 속도 (도/초)
  const HOVER_MULT = 6;               // 커서를 올렸을 때 배수
  const IMG_CROP = 1.12;              // 원 안에서 사진 확대 (검은 테두리 덜 보이게)
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 보기 모드: full = 갤러리, preview = 촬영 완료 화면 뒤 (작게, 위쪽)
  let viewMode = new URLSearchParams(location.search).get('mode') === 'preview' ? 'preview' : 'full';
  const VIEW = { full: { zoom: 1, cy: 0.6 }, preview: { zoom: 0.62, cy: 0.25 } };
  let vz = VIEW[viewMode].zoom, vcy = VIEW[viewMode].cy;
  function setViewMode(m) {
    viewMode = m === 'preview' ? 'preview' : 'full';
    document.body.classList.toggle('preview', viewMode === 'preview');
    if (viewMode === 'preview') { pan.x = pan.y = 0; vel.x = vel.y = 0; panTarget = null; closeLightbox?.(); }
  }

  const nodes = [];                    // 최신 사진이 가운데
  let W, H, D, SIZE, R, contentR = 0;
  function measure() {
    W = innerWidth; H = innerHeight;
    D = W < 600 ? 120 : 195;           // 이웃한 원 중심 사이 거리 (클수록 줌인)
    SIZE = D * 0.8;                    // 원 지름 (D 대비 비율이 작을수록 간격이 넓어짐)
    R = Math.min(W, H) * 0.5;          // 이 반경 밖으로 갈수록 작아짐
    for (const n of nodes) n.el.style.width = n.el.style.height = SIZE + 'px';
    layout();
  }

  // ---------- 허니콤 배치 (가운데부터 나선형) ----------
  const DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
  function hexSpiral(n) {
    const out = [[0, 0]];
    for (let k = 1; out.length < n; k++) {
      let q = -k, r = k;
      for (let i = 0; i < 6; i++) {
        for (let j = 0; j < k; j++) {
          out.push([q, r]);
          q += DIRS[i][0]; r += DIRS[i][1];
        }
      }
    }
    return out.slice(0, n);
  }

  function layout() {
    const cells = hexSpiral(nodes.length);
    contentR = 0;
    nodes.forEach((n, i) => {
      const [q, r] = cells[i];
      n.tx = D * (q + r / 2);
      n.ty = D * (Math.sqrt(3) / 2) * r;
      if (n.cx === undefined) { n.cx = n.tx; n.cy = n.ty; }
      contentR = Math.max(contentR, Math.hypot(n.tx, n.ty));
    });
  }

  const stage = $('stage');
  function addNode(p, atFront) {
    if (nodes.some(n => n.p.id === p.id)) return null;
    const el = document.createElement('div');
    el.className = 'cell';
    el.style.width = el.style.height = SIZE + 'px';
    el.innerHTML = `<img src="${esc(photoUrl(p.path))}" alt="${esc(p.name)}" draggable="false">`;
    const n = {
      p, el, img: el.firstChild,
      angle: Math.random() * 360,
      base: SPIN_MIN + Math.random() * (SPIN_MAX - SPIN_MIN),
      speed: 0, hover: false, vx: 0, vy: 0,
    };
    n.speed = n.base;
    el.addEventListener('pointerenter', () => { if (!drag) { n.hover = true; showLabel(n); } });
    el.addEventListener('pointerleave', () => { n.hover = false; if (labelNode === n) showLabel(null); });
    if (atFront) {
      nodes.unshift(n);
      n.cx = 0; n.cy = 0; n.pop = 0;   // 가운데에서 튀어나오듯 등장
    } else {
      nodes.push(n);
    }
    stage.appendChild(el);
    return n;
  }
  function removeNode(id) {
    const i = nodes.findIndex(n => n.p.id === id);
    if (i < 0) return;
    nodes[i].el.remove();
    if (labelNode === nodes[i]) showLabel(null);
    nodes.splice(i, 1);
    layout();
  }

  // ---------- 이름 라벨 ----------
  let labelNode = null;
  function showLabel(n) {
    labelNode = n;
    const l = $('label');
    if (!n) { l.classList.remove('show'); return; }
    l.innerHTML = esc(n.p.name) + (n.p.affiliation ? `<span>${esc(n.p.affiliation)}</span>` : '');
    l.classList.add('show');
  }

  // ---------- 드래그 (관성 포함) ----------
  const pan = { x: 0, y: 0 }, vel = { x: 0, y: 0 };
  let drag = null, panTarget = null;

  stage.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    try { stage.setPointerCapture(e.pointerId); } catch {}
    drag = { id: e.pointerId, sx: e.clientX, sy: e.clientY, lx: e.clientX, ly: e.clientY,
             lt: performance.now(), moved: 0, target: e.target.closest('.cell') };
    vel.x = vel.y = 0;
    panTarget = null;
  });
  stage.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const now = performance.now(), dx = e.clientX - drag.lx, dy = e.clientY - drag.ly;
    const dt = Math.max(now - drag.lt, 1) / 1000;
    pan.x += dx; pan.y += dy;
    vel.x = vel.x * 0.6 + (dx / dt) * 0.4;
    vel.y = vel.y * 0.6 + (dy / dt) * 0.4;
    drag.lx = e.clientX; drag.ly = e.clientY; drag.lt = now;
    drag.moved = Math.max(drag.moved, Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy));
    if (drag.moved > 6 && !stage.classList.contains('dragging')) {
      stage.classList.add('dragging');
      cursor.classList.remove('on');
      showLabel(null);
      nodes.forEach(n => n.hover = false);
    }
  });
  function endDrag(e) {
    if (!drag || e.pointerId !== drag.id) return;
    const wasClick = drag.moved <= 6, target = drag.target;
    if (performance.now() - drag.lt > 80) vel.x = vel.y = 0;   // 멈췄다가 놓으면 관성 없음
    drag = null;
    stage.classList.remove('dragging');
    if (e.pointerType === 'mouse') cursor.classList.add('on');
    if (wasClick && target) {
      const n = nodes.find(n => n.el === target);
      if (n) openLightbox(n);
    }
  }
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);
  stage.addEventListener('wheel', e => {
    e.preventDefault();
    panTarget = null;
    pan.x -= e.deltaX; pan.y -= e.deltaY;
  }, { passive: false });

  // ---------- 커서 ----------
  const cursor = $('cursor');
  const cur = { x: -100, y: -100, tx: -100, ty: -100 };
  addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse') return;
    cur.tx = e.clientX; cur.ty = e.clientY;
    if (!cursor.classList.contains('on')) { cur.x = cur.tx; cur.y = cur.ty; }
    const overStage = e.target === stage || e.target.closest?.('.cell');
    cursor.classList.toggle('on', !!overStage && !stage.classList.contains('dragging'));
    cursor.classList.toggle('big', !!e.target.closest?.('.cell'));
  });
  document.addEventListener('pointerleave', () => cursor.classList.remove('on'));

  // ---------- 매 프레임 ----------
  const smooth = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.1);
    last = now;

    const ck = 1 - Math.exp(-25 * dt);
    cur.x += (cur.tx - cur.x) * ck; cur.y += (cur.ty - cur.y) * ck;
    cursor.style.transform = `translate3d(${cur.x}px, ${cur.y}px, 0)`;

    if (!drag) {
      if (panTarget) {
        const k = 1 - Math.exp(-6 * dt);
        pan.x += (panTarget.x - pan.x) * k; pan.y += (panTarget.y - pan.y) * k;
        if (Math.hypot(panTarget.x - pan.x, panTarget.y - pan.y) < 0.5) panTarget = null;
      } else {
        pan.x += vel.x * dt; pan.y += vel.y * dt;
        const f = Math.exp(-4 * dt);
        vel.x *= f; vel.y *= f;
        // 사진들 바깥으로 너무 나가면 부드럽게 되돌림
        const lim = contentR + D * 0.5, d = Math.hypot(pan.x, pan.y);
        if (d > lim) {
          const k = 1 - Math.exp(-8 * dt), s = lim / d;
          pan.x += (pan.x * s - pan.x) * k; pan.y += (pan.y * s - pan.y) * k;
        }
      }
    }

    const vk = 1 - Math.exp(-4 * dt);
    vz += (VIEW[viewMode].zoom - vz) * vk;
    vcy += (VIEW[viewMode].cy - vcy) * vk;

    const lk = 1 - Math.exp(-6 * dt), sk = 1 - Math.exp(-3 * dt);
    const K = 70, DAMP = 10;           // 스프링 (DAMP가 작을수록 더 출렁임)
    for (const n of nodes) {
      n.vx += ((n.tx - n.cx) * K - n.vx * DAMP) * dt;
      n.vy += ((n.ty - n.cy) * K - n.vy * DAMP) * dt;
      n.cx += n.vx * dt; n.cy += n.vy * dt;
      if (n.pop !== undefined) { n.pop += (1 - n.pop) * lk; if (n.pop > 0.999) delete n.pop; }

      // 애플워치처럼: 화면 가운데는 크게, 가장자리로 갈수록 작고 촘촘하게
      const sx = (n.cx + pan.x) * vz, sy = (n.cy + pan.y) * vz;
      const t = Math.hypot(sx, sy) / R;
      const scale = (1 - 0.7 * smooth(0.45, 1.5, t)) * (n.pop ?? 1) * vz;
      const squeeze = 1 - 0.18 * smooth(0.6, 1.6, t);
      const px = W / 2 + sx * squeeze, py = H * vcy + sy * squeeze;

      const half = SIZE * scale / 2;
      const visible = px + half > 0 && px - half < W && py + half > 0 && py - half < H && scale > 0.05;
      if (!visible) { if (n.shown !== false) { n.el.style.visibility = 'hidden'; n.shown = false; } continue; }
      if (n.shown === false) { n.el.style.visibility = ''; n.shown = true; }
      n.el.style.transform = `translate3d(${px - SIZE / 2}px, ${py - SIZE / 2}px, 0) scale(${scale})`;

      if (!reduceMotion) {
        const target = n.hover ? n.base * HOVER_MULT : n.base;
        n.speed += (target - n.speed) * sk;
        n.angle = (n.angle + n.speed * dt) % 360;
      }
      n.img.style.transform = `rotate(${n.angle}deg) scale(${IMG_CROP})`;

      if (labelNode === n) {
        const l = $('label');
        l.style.left = px + 'px';
        l.style.top = (py + half + 8) + 'px';
      }
    }
    requestAnimationFrame(frame);
  }

  // ---------- 크게 보기 ----------
  let lbNode = null;
  function openLightbox(n) {
    lbNode = n;
    $('lbImg').src = $('lbImgBack').src = photoUrl(n.p.path);
    $('lbFlip').classList.remove('flipped');
    const qr = qrcode(0, 'L');
    qr.addData(Booth.shareUrl(n.p.id));
    qr.make();
    $('lbQr').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
    $('lbCap').innerHTML = esc(n.p.name) + (n.p.affiliation ? `<span>${esc(n.p.affiliation)}</span>` : '')
      + (n.p.hidden ? '<b class="hidden-tag">숨김</b>' : '');
    $('lbHide').textContent = n.p.hidden ? '다시 보이기' : '숨기기';
    $('lb').classList.add('open');
  }
  const closeLightbox = () => { $('lb').classList.remove('open'); lbNode = null; };
  // 사진·버튼 바깥을 누르면 닫힘, 사진이나 flip 버튼을 누르면 뒤집힘
  $('lb').onclick = e => {
    if (e.target.closest('.flip')) { $('lbFlip').classList.toggle('flipped'); return; }
    if (e.target.closest('#lbBack') || !e.target.closest('button')) closeLightbox();
  };
  // 촬영 화면 위에 띄워졌을 때: 셔터 버튼/ESC → 페이지 이동 없이 닫기 (전체화면 유지)
  const embedded = window.parent !== window;
  const closeEmbedded = () => parent.postMessage({ type: 'booth:close-archive' }, location.origin);
  document.querySelector('.back').addEventListener('click', e => {
    if (!embedded) return;
    e.preventDefault();
    closeEmbedded();
  });
  addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if ($('lb').classList.contains('open')) closeLightbox();
    else if (embedded) closeEmbedded();
  });

  // archive.html#<id> 로 열면 해당 사진으로 이동
  function focusHash() {
    const id = location.hash.slice(1);
    const n = id && nodes.find(n => n.p.id === id);
    if (!n) return false;
    // 잠깐 흰 테두리로 표시했다가 사라짐
    nodes.forEach(m => m.el.classList.toggle('hl', m === n));
    clearTimeout(focusHash.t);
    focusHash.t = setTimeout(() => n.el.classList.remove('hl'), 2500);
    panTarget = { x: -n.tx, y: -n.ty };
    return true;
  }
  addEventListener('hashchange', focusHash);

  // ---------- 관리자 ----------
  const dlg = $('loginDlg'), adminLink = $('adminLink');
  let isAdmin = false;
  async function refreshAdmin() {
    const { data: { session } } = await db.auth.getSession();
    let ok = false;
    if (session) ok = (await db.rpc('is_admin')).data === true;
    isAdmin = ok;
    document.body.classList.toggle('admin', ok);
    adminLink.textContent = session ? (ok ? '관리자 로그아웃' : '로그아웃 (권한 없음)') : '관리자';
    return { session, ok };
  }
  adminLink.onclick = async e => {
    e.preventDefault();
    const { session } = await refreshAdmin();
    if (session) { await db.auth.signOut(); location.reload(); return; }
    $('loginMsg').textContent = '';
    dlg.showModal();
  };
  $('loginCancel').onclick = () => dlg.close();
  $('loginForm').onsubmit = async e => {
    e.preventDefault();
    const msg = $('loginMsg');
    msg.textContent = '';
    const { error } = await db.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pw').value });
    if (error) { msg.textContent = '로그인 실패: ' + error.message; return; }
    const { ok } = await refreshAdmin();
    if (!ok) { msg.textContent = '관리자로 등록된 계정이 아니에요.'; return; }
    location.reload();
  };

  // 숨기기 / 다시 보이기
  $('lbHide').onclick = async e => {
    e.stopPropagation();
    const n = lbNode;
    if (!n) return;
    const hide = !n.p.hidden, btn = $('lbHide');
    btn.disabled = true;
    const { error } = await db.rpc('set_photo_hidden', { p_id: n.p.id, p_hidden: hide });
    btn.disabled = false;
    if (error) { alert('바꾸지 못했어요: ' + error.message); return; }
    applyRow({ ...n.p, hidden: hide });
    feed.send({ type: 'broadcast', event: 'visibility', payload: { ...n.p, hidden: hide } });
    openLightbox(n);
  };
  // 행 변경 반영: 관리자는 숨긴 사진도 흐리게 보이고, 방문자에게선 사라짐
  function applyRow(p) {
    const n = nodes.find(n => n.p.id === p.id);
    const visible = p.archived && (!p.hidden || isAdmin);
    if (n && !visible) { removeNode(p.id); return; }
    if (n) { n.p = p; n.el.classList.toggle('is-hidden', !!p.hidden); return; }
    if (visible) {
      $('empty')?.remove();
      const m = addNode(p, true);
      if (m) { m.el.classList.toggle('is-hidden', !!p.hidden); layout(); focusHash(); }
    }
  }

  $('lbDel').onclick = async e => {
    e.stopPropagation();
    const n = lbNode;
    if (!n || !confirm(`"${n.p.name}" 사진을 삭제할까요?\n사진 파일과 기록이 모두 지워지고 되돌릴 수 없어요.`)) return;
    const btn = $('lbDel');
    btn.disabled = true; btn.textContent = '삭제 중…';
    const done = m => { btn.disabled = false; btn.textContent = '완전 삭제'; if (m) alert('삭제하지 못했어요: ' + m); };
    const rm = await db.storage.from(C.BUCKET).remove([n.p.path]);
    if (rm.error) return done(rm.error.message);
    const del = await db.from('photos').delete().eq('id', n.p.id).select('id');
    if (del.error) return done(del.error.message);
    if (!del.data.length) return done('권한이 없어요. 관리자로 다시 로그인해 주세요.');
    done();
    closeLightbox();
    removeNode(n.p.id);
  };
  await refreshAdmin();

  // ---------- 촬영 화면과 통신 ----------
  // 던져진 사진이 가운데로 들어오면 주변 사진들이 튕겨났다가 다시 모임
  function insertThrown(p) {
    $('empty')?.remove();
    for (const n of nodes) {
      let d = Math.hypot(n.cx, n.cy), ux, uy;
      if (d < 1) { const a = Math.random() * Math.PI * 2; ux = Math.cos(a); uy = Math.sin(a); d = 1; }
      else { ux = n.cx / d; uy = n.cy / d; }
      const f = 1400 * Math.exp(-d / (D * 2.4));
      n.vx += ux * f; n.vy += uy * f;
    }
    if (addNode({ ...p, archived: true, hidden: false }, true)) layout();
  }
  addEventListener('message', e => {
    if (e.origin !== location.origin || !e.data) return;
    if (e.data.type === 'booth:mode') setViewMode(e.data.mode);
    if (e.data.type === 'booth:insert') insertThrown(e.data.photo);
  });
  setViewMode(viewMode);

  // ---------- 데이터 ----------
  measure();
  addEventListener('resize', measure);
  requestAnimationFrame(frame);

  const { data, error } = await db.from('photos').select('*').eq('archived', true)
    .order('created_at', { ascending: false }).limit(1000);
  if (error) {
    document.body.insertAdjacentHTML('beforeend', `<p class="empty">불러오지 못했어요: ${esc(error.message)}</p>`);
    return;
  }
  if (!data.length) document.body.insertAdjacentHTML('beforeend', '<p class="empty" id="empty">아직 사진이 없어요.</p>');
  // 미리보기: archive.html?demo=40 → 기존 사진을 반복해 40장처럼 보여줌
  const demo = +new URLSearchParams(location.search).get('demo') || 0;
  const list = demo && data.length
    ? Array.from({ length: demo }, (_, i) => ({ ...data[i % data.length], id: data[i % data.length].id + '-' + i }))
    : data;
  for (const p of list) { const n = addNode(p, false); if (n && p.hidden) n.el.classList.add('is-hidden'); }
  layout();
  focusHash();

  const feed = db.channel('photos-feed')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'photos', filter: 'archived=eq.true' }, ({ new: p }) => applyRow(p))
    .on('broadcast', { event: 'visibility' }, ({ payload }) => applyRow(payload))
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'photos' }, ({ old }) => removeNode(old.id))
    .subscribe();
})();
</script>
</body>
</html>
