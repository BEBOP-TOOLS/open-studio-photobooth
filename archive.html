<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archive</title>
<link rel="stylesheet" href="style.css?v=20261026225705">
<style>
  .nav { display: flex; gap: 20px; padding: 20px 32px 0; font-size: 14px; font-weight: 600; }
  .nav a { color: var(--muted); text-decoration: none; }
  .nav a.on { color: var(--fg); }
  figure.hl img { outline: 3px solid var(--fg); outline-offset: 4px; }
  header {
    padding: 28px 32px 24px;
    display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap;
  }
  header h1 { margin: 6px 0 0; font-size: 44px; letter-spacing: -0.02em; }
  .count { color: var(--muted); font-variant-numeric: tabular-nums; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 24px 16px;
    padding: 0 32px 64px;
  }
  figure { margin: 0; cursor: zoom-in; }
  figure img {
    width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block;
    background: var(--line);
  }
  figcaption { margin-top: 8px; font-size: 15px; line-height: 1.4; }
  figcaption b { font-weight: 600; }
  figcaption span { color: var(--muted); margin-left: 6px; }
  figure.new { animation: pop .6s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .empty { padding: 32px; color: var(--muted); }

  /* 관리자 */
  .nav .admin-link { margin-left: auto; font-weight: 500; }
  figure { position: relative; }
  .del {
    display: none; position: absolute; top: 8px; right: 8px;
    padding: 6px 12px; font-size: 13px; border-radius: 999px;
    background: rgba(0,0,0,.7); color: #fff; border: 1px solid rgba(255,255,255,.5);
  }
  body.admin .del { display: block; }
  .del:hover { background: var(--danger); border-color: var(--danger); }
  dialog {
    background: var(--panel); color: var(--fg); border: 1px solid var(--line);
    border-radius: 16px; padding: 28px; width: min(360px, calc(100vw - 32px));
  }
  dialog::backdrop { background: rgba(0,0,0,.7); }
  dialog h2 { margin: 0 0 20px; font-size: 20px; }
  dialog input {
    width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; margin-bottom: 10px;
    background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 10px;
  }
  dialog .row { display: flex; gap: 8px; margin-top: 8px; }
  dialog .row button { flex: 1; padding: 12px; font-size: 15px; }
  dialog .msg { color: var(--danger); font-size: 14px; min-height: 20px; margin: 4px 0 0; }

  .lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,.94);
    display: none; place-items: center; z-index: 5; cursor: zoom-out; padding: 24px;
  }
  .lightbox.open { display: grid; }
  .lightbox img { max-height: 82vh; max-width: 100%; display: block; }
  .lightbox p { text-align: center; font-size: 20px; margin: 16px 0 0; }
  .lightbox p span { color: var(--muted); margin-left: 8px; }

  @media (max-width: 600px) {
    header { padding: 20px 16px 16px; }
    .nav { padding: 16px 16px 0; }
    header h1 { font-size: 32px; }
    .grid { grid-template-columns: repeat(2, 1fr); padding: 0 16px 48px; gap: 16px 10px; }
  }
</style>
</head>
<body>
<nav class="nav"><a href="index.html">Photo Booth</a><a class="on" href="archive.html">Archive</a><a href="#" class="admin-link" id="adminLink">관리자</a></nav>
<header>
  <div>
    <div class="eyebrow" id="sub"></div>
    <h1 id="title">Archive</h1>
  </div>
  <div class="count" id="count"></div>
</header>
<main class="grid" id="grid"></main>
<dialog id="loginDlg">
  <form method="dialog" id="loginForm">
    <h2>관리자 로그인</h2>
    <input type="email" id="email" placeholder="이메일" autocomplete="username" required>
    <input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password" required>
    <p class="msg" id="loginMsg"></p>
    <div class="row">
      <button type="button" id="loginCancel">취소</button>
      <button type="submit" class="primary">로그인</button>
    </div>
  </form>
</dialog>
<div class="lightbox" id="lb"><div><img id="lbImg" alt=""><p id="lbCap"></p></div></div>

<script src="config.js?v=20261026225705"></script>
<script src="lib/supabase.min.js?v=20261026225705"></script>
<script src="common.js?v=20261026225705"></script>
<script>
(async function () {
  const { C, db, photoUrl, esc } = window.Booth;
  const grid = document.getElementById('grid');
  document.getElementById('title').textContent = C.EVENT_TITLE + ' Archive';
  document.getElementById('sub').textContent = C.EVENT_SUB || '';
  const seen = new Set();
  let total = 0;

  function card(p, isNew) {
    if (seen.has(p.id)) return null;
    seen.add(p.id);
    total++;
    const f = document.createElement('figure');
    f.id = 'p-' + p.id;
    if (isNew) f.className = 'new';
    const src = photoUrl(p.path);
    f.innerHTML = `<img loading="lazy" src="${esc(src)}" alt="${esc(p.name)}">
      <figcaption><b>${esc(p.name)}</b>${p.affiliation ? `<span>${esc(p.affiliation)}</span>` : ''}</figcaption>
      <button class="del" type="button">삭제</button>`;
    f.querySelector('.del').onclick = e => { e.stopPropagation(); removePhoto(p, f); };
    f.onclick = () => {
      document.getElementById('lbImg').src = src;
      document.getElementById('lbCap').innerHTML = `${esc(p.name)}${p.affiliation ? `<span>${esc(p.affiliation)}</span>` : ''}`;
      document.getElementById('lb').classList.add('open');
    };
    return f;
  }
  document.getElementById('lb').onclick = e => e.currentTarget.classList.remove('open');
  const updateCount = () => document.getElementById('count').textContent = total ? `${total} portraits` : '';

  function dropCard(id) {
    const el = document.getElementById('p-' + id);
    if (!el) return;
    el.remove();
    seen.delete(id);
    total--;
    updateCount();
  }

  // ---------- 관리자 ----------
  const dlg = document.getElementById('loginDlg');
  const adminLink = document.getElementById('adminLink');

  async function refreshAdmin() {
    const { data: { session } } = await db.auth.getSession();
    let ok = false;
    if (session) ok = (await db.rpc('is_admin')).data === true;
    document.body.classList.toggle('admin', ok);
    adminLink.textContent = session ? (ok ? '관리자 로그아웃' : '로그아웃 (권한 없음)') : '관리자';
    return { session, ok };
  }

  adminLink.onclick = async e => {
    e.preventDefault();
    const { session } = await refreshAdmin();
    if (session) { await db.auth.signOut(); refreshAdmin(); return; }
    document.getElementById('loginMsg').textContent = '';
    dlg.showModal();
  };
  document.getElementById('loginCancel').onclick = () => dlg.close();
  document.getElementById('loginForm').onsubmit = async e => {
    e.preventDefault();
    const msg = document.getElementById('loginMsg');
    msg.textContent = '';
    const { error } = await db.auth.signInWithPassword({
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('pw').value,
    });
    if (error) { msg.textContent = '로그인 실패: ' + error.message; return; }
    const { ok } = await refreshAdmin();
    if (!ok) { msg.textContent = '관리자로 등록된 계정이 아니에요.'; return; }
    document.getElementById('pw').value = '';
    dlg.close();
  };

  async function removePhoto(p, el) {
    if (!confirm(`"${p.name}" 사진을 삭제할까요?\n사진 파일과 기록이 모두 지워지고 되돌릴 수 없어요.`)) return;
    const btn = el.querySelector('.del');
    btn.disabled = true;
    btn.textContent = '삭제 중…';
    const fail = m => { alert('삭제하지 못했어요: ' + m); btn.disabled = false; btn.textContent = '삭제'; };
    const rm = await db.storage.from(C.BUCKET).remove([p.path]);
    if (rm.error) return fail(rm.error.message);
    const del = await db.from('photos').delete().eq('id', p.id).select('id');
    if (del.error) return fail(del.error.message);
    if (!del.data.length) return fail('권한이 없어요. 관리자로 다시 로그인해 주세요.');
    dropCard(p.id);
  }

  refreshAdmin();

  const { data, error } = await db.from('photos').select('*').eq('archived', true).order('created_at', { ascending: false }).limit(1000);
  if (error) {
    grid.outerHTML = `<p class="empty">불러오지 못했어요: ${esc(error.message)}</p>`;
    return;
  }
  if (!data.length) grid.insertAdjacentHTML('beforebegin', '<p class="empty" id="empty">아직 사진이 없어요.</p>');
  for (const p of data) { const el = card(p); if (el) grid.appendChild(el); }
  updateCount();

  // archive.html#<id> 로 열면 해당 사진으로 스크롤
  function focusHash() {
    const id = location.hash.slice(1);
    const el = id && document.getElementById('p-' + id);
    if (!el) return false;
    document.querySelectorAll('figure.hl').forEach(f => f.classList.remove('hl'));
    el.classList.add('hl');
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return true;
  }
  focusHash();
  addEventListener('hashchange', focusHash);

  db.channel('photos-feed')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'photos', filter: 'archived=eq.true' }, ({ new: p }) => {
      document.getElementById('empty')?.remove();
      const el = card(p, true);
      if (el) { grid.prepend(el); updateCount(); focusHash(); }
    })
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'photos' }, ({ old }) => dropCard(old.id))
    .subscribe();
})();
</script>
</body>
</html>
